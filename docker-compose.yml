# All configuration comes from .env (copy .env.example to .env and fill it in).
# This file contains no secrets or literal credentials — only ${VAR} references.

x-backend: &backend
  build:
    context: .
  env_file: .env
  environment:
    # Inside the compose network, services reach each other by service name,
    # not localhost. These are assembled from values that live in .env.
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    RUSTFS_ENDPOINT: http://rustfs:9000
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rustfs-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  backend:
    <<: *backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:%s/api/v1/health' % os.environ['BACKEND_PORT'])"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "tasks", "worker", "--loglevel=info"]

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the client bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  landing:
    build:
      context: ./landing
      args:
        # Inlined into the static output at build time
        PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "${LANDING_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  # One-shot job: creates the bucket if it does not exist yet
  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$RUSTFS_BUCKET" 2>/dev/null && exit 0
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$RUSTFS_BUCKET" 2>/dev/null && exit 0
          sleep 2
        done
        echo "could not create bucket $$RUSTFS_BUCKET" >&2
        exit 1
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
